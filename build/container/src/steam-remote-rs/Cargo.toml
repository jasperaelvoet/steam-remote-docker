[package]
name = "steam-remote"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"

[[bin]]
name = "steam-remote"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
nix = { version = "0.29", features = ["fs", "mount", "process", "signal", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "net"] }
