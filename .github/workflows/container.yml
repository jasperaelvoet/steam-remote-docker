name: Publish OCI Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/steam-remote-docker

jobs:
  validate:
    name: Validate sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install development dependencies
        run: bun install --frozen-lockfile

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Check sources
        run: bun run check

  publish:
    name: Build and publish linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build OCI image
        run: |
          podman build \
            --platform linux/amd64 \
            --format oci \
            --layers \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            --file Containerfile \
            .

      - name: Push OCI image
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${REGISTRY_PASSWORD}" | podman login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          podman push "${IMAGE}:latest"
          podman push "${IMAGE}:sha-${GITHUB_SHA}"
